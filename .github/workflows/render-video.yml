name: Render Cinema Documentary Video

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tts_engine:
        description: "Neural TTS synthesis engine (kokoro or gemini)"
        required: false
        default: "kokoro"
        type: choice
        options:
          - kokoro
          - gemini

permissions:
  contents: write

jobs:
  render-cinema-video:
    name: Synthesize, Render & Master 1080p Documentary
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Audio, Video, Font & Headless Chromium Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg espeak-ng libsndfile1 fonts-noto-color-emoji \
            libnss3 libgbm1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libdrm2 libxkbcommon0 libpango-1.0-0 libcairo2 libxshmfence1
          sudo apt-get install -y libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 || \
            sudo apt-get install -y libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            .github/workflows/render-video.yml
            scripts/generate_audio_and_transcript.py
            scripts/generate_soundscape_and_sfx.py

      - name: Install Neural TTS, Whisper Alignment & DSP Packages
        run: |
          python -m pip install --upgrade pip
          pip install kokoro-onnx soundfile scipy numpy faster-whisper google-genai

      - name: Run Pre-Render Static QA Audit
        run: python3 scripts/validate_project_static.py

      - name: Cache Kokoro-82M v1.0 ONNX Model & Voice Bank
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-onnx-model-files-v1.0

      - name: Download Kokoro-82M Model Weights If Missing
        run: |
          mkdir -p .cache/kokoro
          BASE_URL="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0"
          if [ ! -s .cache/kokoro/kokoro-v1.0.onnx ]; then
            echo "Downloading kokoro-v1.0.onnx..."
            curl -fL --retry 3 --retry-delay 2 \
              "${BASE_URL}/kokoro-v1.0.onnx" \
              -o .cache/kokoro/kokoro-v1.0.onnx
          fi
          if [ ! -s .cache/kokoro/voices-v1.0.bin ]; then
            echo "Downloading voices-v1.0.bin..."
            curl -fL --retry 3 --retry-delay 2 \
              "${BASE_URL}/voices-v1.0.bin" \
              -o .cache/kokoro/voices-v1.0.bin
          fi
          ls -lh .cache/kokoro/

      - name: Synthesize Multi-Character Voiceover, Whisper Timestamps & Timeline Manifest
        env:
          TTS_ENGINE: ${{ inputs.tts_engine || 'kokoro' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KOKORO_CACHE_DIR: ${{ github.workspace }}/.cache/kokoro
        run: |
          python3 scripts/generate_audio_and_transcript.py
          ls -lh public/audio/voiceover_master.wav \
                 public/captions/transcript.srt \
                 public/captions/transcript.vtt \
                 src/generated/timeline-manifest.json

      - name: Synthesize Cinema Underscore, Foley SFX & Ducked Master Mix
        run: |
          python3 scripts/generate_soundscape_and_sfx.py
          ls -lh public/audio/bgm_bed.wav public/audio/master_mix.wav

      - name: Set Up Node.js 22 & Install Remotion Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install NPM Packages
        run: npm install --no-audit --no-fund

      - name: Type-Check Remotion Composition & Generated Manifest
        run: |
          python3 scripts/validate_project_static.py
          npx tsc --noEmit

      - name: Ensure Headless Browser & Render Raw 1080p Remotion Video
        run: |
          mkdir -p out
          npx remotion browser ensure
          npx remotion render src/index.ts BangladeshVsRussia out/raw_remotion.mp4 \
            --codec=h264 \
            --crf=16 \
            --pixel-format=yuv420p \
            --concurrency=4 \
            --timeout=120000 \
            --gl=angle
          ls -lh out/raw_remotion.mp4

      - name: Master Cinema Color Grade, EBU R128 (-14 LUFS) Audio & QA Stills
        run: bash scripts/master_color_grade_ffmpeg.sh

      - name: Automated CI Verification Gate (ffprobe & Audio Volume Assertions)
        run: |
          set -euo pipefail
          MASTER_MP4="out/bd-vs-russia-population-1080p-mastered.mp4"

          if [ ! -s "$MASTER_MP4" ]; then
            echo "::error::Mastered MP4 missing or empty: $MASTER_MP4"
            exit 1
          fi

          ffprobe -v quiet -print_format json -show_format -show_streams "$MASTER_MP4" > out/ffprobe_master.json
          VOL_LOG="$(ffmpeg -hide_banner -nostats -i "$MASTER_MP4" -vn -af volumedetect -f null - 2>&1 || true)"

          VOL_REPORT="$VOL_LOG" python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          probe_path = pathlib.Path("out/ffprobe_master.json")
          mp4_path = pathlib.Path("out/bd-vs-russia-population-1080p-mastered.mp4")
          probe = json.loads(probe_path.read_text(encoding="utf-8"))

          streams = probe.get("streams", [])
          fmt = probe.get("format", {})

          v_stream = next((s for s in streams if s.get("codec_type") == "video"), None)
          a_stream = next((s for s in streams if s.get("codec_type") == "audio"), None)
          s_stream = next((s for s in streams if s.get("codec_type") == "subtitle"), None)

          assert v_stream is not None, "Missing video stream in mastered MP4"
          assert a_stream is not None, "Missing audio stream in mastered MP4"

          v_codec = v_stream.get("codec_name")
          width = int(v_stream.get("width", 0))
          height = int(v_stream.get("height", 0))
          pix_fmt = v_stream.get("pix_fmt")
          r_fps = v_stream.get("r_frame_rate", "")

          assert v_codec == "h264", f"Expected video codec 'h264', got {v_codec!r}"
          assert (width, height) == (1920, 1080), f"Expected 1920x1080, got {width}x{height}"

          a_codec = a_stream.get("codec_name")
          sample_rate = int(a_stream.get("sample_rate", 0))
          channels = int(a_stream.get("channels", 0))
          assert a_codec == "aac", f"Expected audio codec 'aac', got {a_codec!r}"
          assert channels >= 1, f"Expected >= 1 audio channel, got {channels}"

          duration = float(fmt.get("duration") or v_stream.get("duration") or 0.0)
          assert 95.0 <= duration <= 165.0, (
              f"Expected mastered video duration in [95.0s, 165.0s], got {duration:.2f}s"
          )

          vol_log = os.environ.get("VOL_REPORT", "")
          mean_m = re.search(r"mean_volume:\s*([-\d.]+)\s*dB", vol_log)
          max_m = re.search(r"max_volume:\s*([-\d.]+)\s*dB", vol_log)
          assert mean_m and max_m, f"Could not parse volumedetect output:\n{vol_log}"
          mean_vol = float(mean_m.group(1))
          max_vol = float(max_m.group(1))

          assert mean_vol > -55.0 and max_vol > -30.0, (
              f"Audio appears silent or near-zero: mean_volume={mean_vol} dB, max_volume={max_vol} dB"
          )

          size_mb = mp4_path.stat().st_size / (1024 * 1024)

          summary_md = [
              "## Mastered Documentary CI Verification Summary",
              "",
              "| Property | Verified Value | Status |",
              "| :--- | :--- | :--- |",
              f"| **Output File** | `{mp4_path}` (`{size_mb:.2f} MB`) | PASS |",
              f"| **Resolution & Frame Rate** | `{width}x{height}` @ `{r_fps}` (`{pix_fmt}`) | PASS |",
              f"| **Video Stream** | `{v_codec}` (`{v_stream.get('profile', 'High')}`, BT.709) | PASS |",
              f"| **Audio Stream** | `{a_codec}` (`{sample_rate} Hz`, `{channels} ch`) | PASS |",
              f"| **Audio Volume** | Mean `{mean_vol:.2f} dB` / Peak `{max_vol:.2f} dB` | PASS |",
              f"| **Duration** | `{duration:.2f} s` (`{duration / 60.0:.2f} min`, target `95..165 s`) | PASS |",
              f"| **Soft Subtitles** | `{s_stream.get('codec_name', 'none') if s_stream else 'external SRT/VTT'}` | PASS |",
              "",
              "<details><summary>Full <code>ffprobe</code> JSON Stream Report</summary>",
              "",
              "```json",
              json.dumps(probe, indent=2),
              "```",
              "</details>",
              "",
          ]
          report_text = "\n".join(summary_md)
          print(report_text)

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as fh:
                  fh.write(report_text + "\n")
          PY

      - name: Upload Mastered Video Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bd-vs-russia-video-bundle
          if-no-files-found: error
          retention-days: 30
          path: |
            out/bd-vs-russia-population-1080p-mastered.mp4
            public/captions/transcript.srt
            public/captions/transcript.vtt
            out/contact-sheet-8scenes.jpg
            out/poster-thumbnail.png
            src/generated/timeline-manifest.json

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-v1.${{ github.run_number }}
          name: "Bangladesh vs Russia — 1080p Mastered Render #${{ github.run_number }}"
          fail_on_unmatched_files: true
          body: |
            Automated 1080p30 cinema-graded documentary render comparing **Bangladesh vs. Russia: Population Comparison by Size**.

            ### Attached Production Deliverables
            - `bd-vs-russia-population-1080p-mastered.mp4` — `1920x1080` 30fps H.264 BT.709 master with EBU R128 (`-14 LUFS`) stereo audio & embedded `mov_text` captions
            - `transcript.srt` & `transcript.vtt` — Word-aligned speaker-labeled captions (`faster-whisper` forced alignment)
            - `contact-sheet-8scenes.jpg` — `4x2` QA contact sheet across all 8 documentary chapters
            - `poster-thumbnail.png` — `1920x1080` hero thumbnail frame
          files: |
            out/bd-vs-russia-population-1080p-mastered.mp4
            public/captions/transcript.srt
            public/captions/transcript.vtt
            out/contact-sheet-8scenes.jpg
            out/poster-thumbnail.png
